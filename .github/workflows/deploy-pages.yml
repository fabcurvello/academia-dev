name: Deploy da demo (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Testes
        run: npx ng test --watch=false

      - name: Build estático para o GitHub Pages
        run: npx ng build --configuration production,pages

      # O GitHub Pages não conhece as rotas do Angular: o 404.html devolve o app para qualquer URL.
      - name: Fallback de rotas (SPA)
        run: cp dist/academia-dev/browser/index.html dist/academia-dev/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/academia-dev/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
